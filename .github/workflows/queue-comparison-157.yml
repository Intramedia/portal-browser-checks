name: Isolated Google tag queue comparison
on:
  push:
    paths: ['.github/workflows/queue-comparison-157.yml']
  workflow_dispatch:
permissions: {}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: python -m pip install playwright==1.56.0
      - run: curl --fail --silent --show-error 'https://www.googletagmanager.com/gtag/js?id=G-41Y73RQ4Q8' -o /tmp/vt157-tag.js
      - name: Compare command queues with all measurement requests intercepted
        shell: python
        run: |
          from playwright.sync_api import sync_playwright
          from urllib.parse import urlsplit,parse_qs
          from pathlib import Path
          tag=Path('/tmp/vt157-tag.js').read_bytes()
          with sync_playwright() as pw:
           b=pw.chromium.launch(executable_path='/usr/bin/google-chrome',args=['--no-sandbox','--disable-background-networking'])
           for mode in ['global','frame']:
            c=b.new_context(service_workers='block')
            page=c.new_page()
            hits=[]
            def handle(route):
             req=route.request
             u=urlsplit(req.url)
             if req.is_navigation_request(): return route.fulfill(content_type='text/html',headers={'Referrer-Policy':'no-referrer'},body='<title>Valtorres</title>')
             if u.hostname=='www.googletagmanager.com' and u.path=='/gtag/js': return route.fulfill(content_type='application/javascript',body=tag)
             if u.path.endswith('/collect'):
              params=parse_qs(u.query+'&'+(req.post_data or ''))
              hits.append([params.get(k,[''])[0] for k in ['en','tid','dl']])
              return route.fulfill(status=204,headers={'Access-Control-Allow-Origin':'*'})
             return route.abort()
            c.route('**/*',handle)
            page.goto('https://www.valtorres.com/en?q=syntheticqa157')
            target=page
            if mode=='frame':
             el=page.add_script_tag(content="var f=document.createElement('iframe');f.referrerPolicy='no-referrer';f.src='/ga4-context.html';document.body.appendChild(f)")
             page.wait_for_function("document.querySelector('iframe')?.contentDocument?.URL.endsWith('/ga4-context.html')")
             target=page.frames[1]
             target.evaluate("history.replaceState(null,'','/en')")
            target.evaluate("""mode=>{window.dataLayer=[];window.gtag=mode==='array'?(...args)=>dataLayer.push(args):function(){dataLayer.push(arguments)};
             const deny={analytics_storage:'denied',ad_storage:'denied',ad_user_data:'denied',ad_personalization:'denied'};
             gtag('consent','default',deny);gtag('consent','update',{...deny,analytics_storage:'granted'});gtag('js',new Date());
             const id='G-41Y73RQ4Q8', safe={page_location:'https://www.valtorres.com/en',page_path:'/en',page_title:'Valtorres',page_referrer:'https://www.valtorres.com'};
             gtag('set',safe);gtag('config',id,{...safe,send_page_view:false,allow_google_signals:false,allow_ad_personalization_signals:false});
             const s=document.createElement('script');s.src='https://www.googletagmanager.com/gtag/js?id='+id;document.head.appendChild(s);
             gtag('consent','update',{...deny,analytics_storage:'granted'});gtag('event','page_view',{send_to:id,...safe});}""",mode)
            page.wait_for_timeout(5000)
            print(mode,hits,flush=True)
            expected=['page_view','G-41Y73RQ4Q8','https://www.valtorres.com/en']
            if mode=='frame': assert hits==[expected],hits
            c.close()
           b.close()
