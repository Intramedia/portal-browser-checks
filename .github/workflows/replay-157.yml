name: Replay GA4 consent diagnostics
on:
  push:
    branches: ['diagnose/157-consented-page-view']
    paths: ['replay-157.mjs', '.github/workflows/replay-157.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: xvfb-run -a node replay-157.mjs
