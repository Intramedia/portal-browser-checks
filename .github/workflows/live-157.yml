name: Controlled live GA4 acceptance
on:
  push:
    branches: ['diagnose/157-consented-page-view']
    paths: ['.github/workflows/live-157.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 1f3aa57006a9d5d9e63301791a45aeab02bd049e
          persist-credentials: false
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: xvfb-run -a node acceptance-157.mjs
